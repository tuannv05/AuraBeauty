quarkus.application.name=ai-advisor-service
quarkus.http.port=8086

# Reactive PostgreSQL Client (pgvector)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/ai_db
quarkus.datasource.username=app
quarkus.datasource.password=app_secret
quarkus.datasource.reactive.max-size=20

# Kafka
kafka.bootstrap.servers=localhost:9092

# Health check
quarkus.smallrye-health.root-path=/health
quarkus.log.level=INFO
quarkus.log.category."com.cosmetics".level=DEBUG
