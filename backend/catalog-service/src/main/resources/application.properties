quarkus.http.port=8082
quarkus.application.name=catalog-service

# MongoDB configuration
quarkus.mongodb.connection-string=mongodb://localhost:27017/catalog_db
quarkus.mongodb.database=catalog_db
quarkus.mongodb.uuid-representation=java-legacy

# Kafka
kafka.bootstrap.servers=localhost:9092

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.cosmetics".level=DEBUG
