quarkus.application.name=api-gateway
quarkus.http.port=8080

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600S

# JWT
jwt.secret=defaultSecretKeyForCosmeticsPlatformProjectMustBeLongEnough123456789

# Health check
quarkus.smallrye-health.root-path=/health
quarkus.log.level=INFO
quarkus.log.category."com.cosmetics".level=DEBUG
